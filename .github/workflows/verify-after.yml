name: Verify After Image (temporary)

# TEMPORARY verification for issue #4 review R1 P2: the runtime apt mirror
# switch must actually work. Builds the branch image (the build itself runs
# sed+grep+apt-get update as a gate), then verifies the mirrored source
# inside the running container (the path a production server in China takes).
# REMOVED from the branch before the PR is finalized.

on:
  push:
    branches:
      - issue-4-image-size

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build After (branch Dockerfile)
        run: |
          docker build --provenance=false -f Dockerfile -t runtime-after:test .

      - name: Image size
        run: |
          SIZE=$(docker images runtime-after:test --format '{{.Size}}')
          echo "AFTER_SIZE=$SIZE"
          echo "### 📦 After image size: $SIZE" >> $GITHUB_STEP_SUMMARY

      - name: Verify apt mirror switch inside container (runtime path)
        run: |
          docker run --rm --entrypoint bash runtime-after:test -c '
            set -e
            echo "--- sources.list.d/debian.sources ---"
            cat /etc/apt/sources.list.d/debian.sources
            grep -q "mirrors.aliyun.com" /etc/apt/sources.list.d/debian.sources
            echo "--- apt-get update (mirrored) ---"
            apt-get update 2>&1 | tail -3
            rm -rf /var/lib/apt/lists/*
          '

      - name: Smoke — runtimes present
        run: |
          docker run --rm --entrypoint bash runtime-after:test -c '
            set -e
            node --version
            npm --version
            python3 --version
            pip3 --version
            bun --version
            test -x /bin/bash && echo "bash-ok"
          '

      - name: Smoke — native addon loads (sharp)
        run: |
          docker run --rm --entrypoint node -w /app runtime-after:test -e "require('sharp'); console.log('sharp-ok')"

      - name: Smoke — /health endpoint
        run: |
          mkdir -p /tmp/smoke-cfg
          cp -r examples/simple/. /tmp/smoke-cfg/
          docker run -d --name rt-smoke -p 3000:3000 -v /tmp/smoke-cfg:/app/config runtime-after:test
          sleep 8
          RESP=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health || true)
          echo "health status: $RESP"
          docker logs rt-smoke 2>&1 | tail -5 || true
          if [ "$RESP" != "200" ]; then
            echo "::error::/health did not return 200 (got $RESP)"
            docker logs rt-smoke 2>&1 | tail -30
            docker rm -f rt-smoke >/dev/null 2>&1 || true
            exit 1
          fi
          docker rm -f rt-smoke >/dev/null 2>&1 || true
          echo "### 🚦 Smoke tests: all OK" >> $GITHUB_STEP_SUMMARY